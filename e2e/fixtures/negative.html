<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Not code fields</title>
<link rel="stylesheet" href="/fixture.css">
</head>
<body>
<main>
  <h1>Checkout form</h1>
  <p>We will send a verification code to your phone after you place the order.</p>
  <form>
    <label for="n1">Promo code</label><input id="n1" name="promo_code" maxlength="8">
    <label for="n2">ZIP code</label><input id="n2" name="zip" inputmode="numeric" maxlength="5">
    <label for="n3">Mobile number</label><input id="n3" name="phone" type="tel" maxlength="10">
    <label for="n4">Security code (CVV)</label><input id="n4" name="cvv" inputmode="numeric" maxlength="4">
    <label for="n5">Card number</label><input id="n5" name="cardnumber" inputmode="numeric" autocomplete="cc-number">
    <label for="n6">Password</label><input id="n6" name="password" type="password">
    <label for="n7">Confirm password</label><input id="n7" name="verifyPassword" type="password">
    <label for="n8">Quantity</label><input id="n8" name="quantity" type="number" maxlength="4">
    <label for="n9">Year of birth</label><input id="n9" name="birth_year" inputmode="numeric" maxlength="4">
    <label for="n10">Postal code</label><input id="n10" name="pincode" inputmode="numeric" maxlength="6">
    <label for="n11">Full name</label><input id="n11" name="fullname">
    <label for="n12">Country code</label><input id="n12" name="country_code" maxlength="4">
    <label for="n13">Search</label><input id="n13" type="search" name="q">
    <label for="n14">Email</label><input id="n14" type="email" name="email">
    <label for="n15">Notes</label><textarea id="n15" name="notes"></textarea>
    <label for="n16">Amount</label><input id="n16" name="amount" inputmode="numeric" maxlength="6">
    <label for="n17">PIN code</label><input id="n17" name="pincode" inputmode="numeric" maxlength="6">
    <label for="n18">Tracking number</label><input id="n18" name="tracking" maxlength="8">
    <label for="n19">Username</label><input id="n19" name="login" autocomplete="username">
    <label for="n20">Day</label><input id="n20" name="dd" inputmode="numeric" maxlength="2">
  </form>
</main>
</body>
</html>
