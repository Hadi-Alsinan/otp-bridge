name: Something does not work
description: The companion, the extension or the phone setup does not behave as the README says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please check "If something does not work" in the README first. It covers the common cases.

        **Never paste a real code, your private dashboard link (the one with `?k=`) or your phone address (the one with `/p/`).** For a security problem, do not open an issue: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: activity
    attributes:
      label: What the dashboard shows
      description: The lines under "Activity" on the dashboard around the time of the problem, and any warning it displays.
      render: text
  - type: input
    id: version
    attributes:
      label: OTP Bridge version
      description: Shown at the bottom of the dashboard, or run `node companion/cli.js version`.
    validations:
      required: true
  - type: input
    id: computer
    attributes:
      label: Computer and browser
      placeholder: Windows 11, Chrome 131
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone
      description: Include how the phone passes messages on (the OTP Bridge shortcut, an automation built by hand, or the name of the Android app).
      placeholder: iPhone 15, iOS 18.2, OTP Bridge shortcut
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Run `node --version`.
